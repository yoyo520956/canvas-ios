name: InfiniteCanvas
options:
  bundleIdPrefix: com.qingyao
  deploymentTarget: "16.0"

targets:
  InfiniteCanvas:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingyao.infinitecanvas
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 20261023.01
        SWIFT_VERSION: 5.9
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Resources/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIDeviceFamily:
          - 1
          - 2
