name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        continue-on-error: true
        with:
          xcode-version: '16.4'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild archive \
            -project InfiniteCanvas.xcodeproj \
            -scheme InfiniteCanvas \
            -configuration Release \
            -archivePath build/InfiniteCanvas.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log
          grep -nE "error:" build.log | head -20 || echo "No errors found"

      - name: Export IPA
        run: |
          set -euo pipefail
          mkdir -p build/ipa/Payload
          APP_PATH="$(find build/InfiniteCanvas.xcarchive/Products/Applications -name '*.app' -maxdepth 1 | head -1)"
          if [ -d "$APP_PATH" ]; then
            echo "Found app: $APP_PATH"
            cp -R "$APP_PATH" build/ipa/Payload/
            ( cd build/ipa && zip -qry InfiniteCanvas-unsigned.ipa Payload/ )
            echo "IPA created:"
            ls -la build/ipa/InfiniteCanvas-unsigned.ipa
            md5sum build/ipa/InfiniteCanvas-unsigned.ipa | tee build/ipa-md5.txt \
              || md5 build/ipa/InfiniteCanvas-unsigned.ipa | tee build/ipa-md5.txt
          else
            echo "ERROR: .app not found in xcarchive"
            find build/InfiniteCanvas.xcarchive -name '*.app' || true
            exit 1
          fi

      - name: Verify IPA
        run: |
          python3 - <<'PYEOF'
          import zipfile
          p = 'build/ipa/InfiniteCanvas-unsigned.ipa'
          z = zipfile.ZipFile(p)
          names = z.namelist()
          apps = [n for n in names if n.startswith('Payload/') and n.endswith('.app/')]
          execs = [n for n in apps if n.count('/') == 1]
          print('IPA:', p)
          print('App dirs:', apps[:3])
          print('Executable entries:', execs[:3])
          print('Info.plist count:', len([n for n in names if n.endswith('Info.plist')]))
          print('Total files:', len(names))
          assert execs, 'Payload 里没有 .app，打包失败'
          assert any(n.endswith('Info.plist') for n in names), '缺少 Info.plist'
          print('VERIFY OK')
          PYEOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteCanvas-unsigned
          path: build/ipa/InfiniteCanvas-unsigned.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          overwrite_files: true
          prerelease: true
          files: build/ipa/InfiniteCanvas-unsigned.ipa
          name: InfiniteCanvas v0.1.0
          body: |
            ## 无限画布 v0.1.0
            - 无限画布（拖拽/缩放）
            - AI 图片生成节点（Agnes 2.0 API）
            - 文字笔记节点
            - 节点拖拽/调整大小
            - 设置 API Key
