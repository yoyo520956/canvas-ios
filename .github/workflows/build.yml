name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        continue-on-error: true
        with:
          xcode-version: '16.4'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild archive \
            -project InfiniteCanvas.xcodeproj \
            -scheme InfiniteCanvas \
            -configuration Release \
            -archivePath build/InfiniteCanvas.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log
          grep -nE "error:" build.log | head -20 || echo "No errors found"

      - name: Export IPA
        run: |
          set -euo pipefail
          mkdir -p build/ipa/Payload
          APP_PATH="$(find build/InfiniteCanvas.xcarchive/Products/Applications -name '*.app' -maxdepth 1 | head -1)"
          if [ -d "$APP_PATH" ]; then
            echo "Found app: $APP_PATH"
            cp -R "$APP_PATH" build/ipa/Payload/
            ( cd build/ipa && zip -qry InfiniteCanvas-unsigned.ipa Payload/ )
            echo "IPA created:"
            ls -la build/ipa/InfiniteCanvas-unsigned.ipa
            md5sum build/ipa/InfiniteCanvas-unsigned.ipa | tee build/ipa-md5.txt \
              || md5 build/ipa/InfiniteCanvas-unsigned.ipa | tee build/ipa-md5.txt
          else
            echo "ERROR: .app not found in xcarchive"
            find build/InfiniteCanvas.xcarchive -name '*.app' || true
            exit 1
          fi

      - name: Verify IPA
        run: |
          python3 - <<'PYEOF'
          import plistlib, zipfile
          p = 'build/ipa/InfiniteCanvas-unsigned.ipa'
          z = zipfile.ZipFile(p)
          names = z.namelist()
          plists = [n for n in names if n.startswith('Payload/') and n.count('/') == 2 and n.endswith('.app/Info.plist')]
          print('IPA:', p, '| entries:', len(names))
          print('app Info.plist:', plists)
          assert plists, 'Payload/<App>.app/Info.plist 缺失'
          top = plists[0]
          app_dir = top.rsplit('/', 1)[0]                 # Payload/InfiniteCanvas.app
          info = plistlib.loads(z.read(top))
          exe = info.get('CFBundleExecutable', '')
          print('CFBundleExecutable:', exe)
          print('CFBundleIdentifier:', info.get('CFBundleIdentifier'))
          print('CFBundleShortVersionString:', info.get('CFBundleShortVersionString'))
          print('CFBundleVersion:', info.get('CFBundleVersion'))
          print('CFBundleDisplayName:', info.get('CFBundleDisplayName'))
          assert exe, 'Info.plist 没有 CFBundleExecutable'
          assert (app_dir + '/' + exe) in names, '缺少主二进制 ' + exe
          assets = [n for n in names if n.endswith('Assets.car')]
          icon = [n for n in names if 'AppIcon' in n or n.endswith('icon-1024.png')]
          print('Assets.car:', assets)
          print('icon hits:', icon[:3])
          print('VERIFY OK ->', app_dir)
          PYEOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteCanvas-unsigned
          path: build/ipa/InfiniteCanvas-unsigned.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          overwrite_files: true
          prerelease: true
          files: build/ipa/InfiniteCanvas-unsigned.ipa
          name: InfiniteCanvas v0.1.0
          body: |
            ## 无限画布 v0.1.0
            - 无限画布（拖拽/缩放）
            - AI 图片生成节点（Agnes 2.0 API）
            - 文字笔记节点
            - 节点拖拽/调整大小
            - 设置 API Key
